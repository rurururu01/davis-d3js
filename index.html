<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superstore Explorer Dashboard</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #faf9f8;
            color: #5d5d5d;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styling (Filter Section) */
        .sidebar {
            width: 260px;
            background-color: #ffffff;
            border-right: 1px solid #f0f0f0;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 2px 0 15px rgba(0,0,0,0.03);
            z-index: 10;
        }
        .sidebar h2 {
            font-size: 1.1rem;
            margin-top: 0;
            color: #4a4a4a;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .reset-btn {
            background-color: #ffb3ba;
            color: #555;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
        }
        .reset-btn:hover {
            background-color: #ff9eaa;
            transform: scale(1.05);
        }
        .filter-group {
            margin-bottom: 25px;
        }
        .filter-title {
            font-weight: bold;
            color: #8da47e; /* Soft earthy green */
            margin-bottom: 12px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
        }
        .filter-title::before {
            content: "▾";
            margin-right: 8px;
            font-size: 1.2rem;
            color: #baffc9;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            color: #777;
            transition: color 0.2s;
        }
        .checkbox-label:hover {
            color: #333;
        }
        .checkbox-label input[type="checkbox"] {
            margin-right: 10px;
            accent-color: #8da47e; /* Soft green checkbox */
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* Main Content Styling */
        .main-content {
            flex: 1;
            padding: 20px 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            background: #faf9f8;
        }
        .main-content h1 {
            text-align: left;
            color: #4a4a4a;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }
        .dashboard {
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: flex-start;
            gap: 25px;
            flex-wrap: wrap;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #f2f2f2;
            box-shadow: 0 8px 24px rgba(0,0,0,0.04);
            padding: 20px;
            flex: 1;
            min-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        .card h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 20px;
            color: #666;
            width: 100%;
            text-align: left;
            border-bottom: 1px solid #f2f2f2;
            padding-bottom: 10px;
        }

        /* Tooltip style */
        .tooltip {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.95);
            color: #555;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #eaeaea;
            pointer-events: none;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.2s, transform 0.1s;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            line-height: 1.5;
        }

        /* D3 SVG Styles for Soft Pastel Theme */
        .node circle {
            stroke: #ffffff;
            stroke-width: 1.5px;
            cursor: pointer;
            transition: r 0.2s;
        }
        .node circle:hover {
            r: 8;
        }
        .node text {
            font-size: 11px;
            font-family: sans-serif;
            fill: #777;
        }
        .link {
            fill: none;
            stroke: #e8e8e8;
            stroke-width: 1.5px;
        }
        .axis-label {
            font-size: 12px;
            fill: #a0a0a0;
        }
        .domain, .tick line {
            stroke: #e8e8e8;
        }
        .dot {
            cursor: pointer;
            transition: stroke-width 0.2s, r 0.2s;
        }
        .dot:hover {
            stroke-width: 3px;
            r: 10px;
        }
        .no-data {
            color: #ff9eaa;
            margin: 50px 0;
            font-style: italic;
        }
    </style>
</head>
<body>
    
    <!-- Sidebar / Filter Panel -->
    <div class="sidebar">
        <h2>Filters <button class="reset-btn" id="reset-btn">Reset All</button></h2>
        
        <div class="filter-group">
            <div class="filter-title">Region</div>
            <div id="region-filters"></div>
        </div>

        <div class="filter-group">
            <div class="filter-title">Segment</div>
            <div id="segment-filters"></div>
        </div>
    </div>

    <!-- Main Dashboard Area -->
    <div class="main-content">
        <!-- Changed Icon to Basket/Cart -->
        <h1>🛒 Superstore Explorer</h1>
        <div class="dashboard">
            <div class="card">
                <h2>Radial Tidy Tree (Year &rarr; Quarter &rarr; Category)</h2>
                <div id="tree-chart"></div>
            </div>
            <div class="card">
                <h2>Dumbbell Dot Plot (Sales vs Profit by Category)</h2>
                <div id="dumbbell-chart"></div>
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script>
        // Soft Pastel Color Palette
        const categories = ["Furniture", "Office Supplies", "Technology"];
        const colorScale = d3.scaleOrdinal()
            .domain(categories)
            .range(["#ffb3ba", "#baffc9", "#bae1ff"]); // Pastel Pink, Pastel Green, Pastel Blue

        const formatCurrency = d3.format("$,.2f");
        const tooltip = d3.select("#tooltip");

        let superstoreData = [];
        let allRegions = [];
        let allSegments = [];
        let selectedRegions = new Set();
        let selectedSegments = new Set();

        function showTooltip(event, content) {
            tooltip.html(content)
                .style("left", (event.pageX + 15) + "px")
                .style("top", (event.pageY - 15) + "px")
                .style("opacity", 1)
                .style("transform", "scale(1)");
        }

        function hideTooltip() {
            tooltip.style("opacity", 0)
                .style("transform", "scale(0.95)");
        }

        // Load Data
        d3.json("sample_-_superstore.json").then(data => {
            // Pre-process data
            data.forEach(d => {
                d.Sales = +d.Sales;
                d.Profit = +d.Profit;
                let parts = d["Order Date"].split("/");
                if (parts.length === 3) {
                    d.parsedDate = new Date(parts[2], parts[0] - 1, parts[1]);
                } else {
                    d.parsedDate = new Date(d["Order Date"]);
                }
                d.Year = d.parsedDate.getFullYear().toString();
                d.Quarter = "Q" + Math.ceil((d.parsedDate.getMonth() + 1) / 3);
            });

            superstoreData = data;

            // Extract unique values for filters
            allRegions = Array.from(new Set(data.map(d => d.Region))).sort();
            allSegments = Array.from(new Set(data.map(d => d.Segment))).sort();

            // Initialize all as selected
            allRegions.forEach(r => selectedRegions.add(r));
            allSegments.forEach(s => selectedSegments.add(s));

            // Build Checkbox UI
            buildCheckboxes("#region-filters", allRegions, selectedRegions);
            buildCheckboxes("#segment-filters", allSegments, selectedSegments);

            // Initial render
            updateDashboard();

            // Reset Button
            d3.select("#reset-btn").on("click", () => {
                allRegions.forEach(r => selectedRegions.add(r));
                allSegments.forEach(s => selectedSegments.add(s));
                d3.selectAll(".sidebar input[type='checkbox']").property("checked", true);
                updateDashboard();
            });

        }).catch(error => {
            console.error("Error loading data:", error);
            d3.select(".main-content").append("p").text("Error loading data.").style("color", "#ff9eaa");
        });

        function buildCheckboxes(containerId, items, selectedSet) {
            const container = d3.select(containerId);
            container.selectAll("label")
                .data(items)
                .join("label")
                .attr("class", "checkbox-label")
                .html(d => `<input type="checkbox" value="${d}" checked> ${d}`)
                .select("input")
                .on("change", function(event, d) {
                    if (this.checked) {
                        selectedSet.add(d);
                    } else {
                        selectedSet.delete(d);
                    }
                    updateDashboard();
                });
        }

        function updateDashboard() {
            let filteredData = superstoreData.filter(d => 
                selectedRegions.has(d.Region) && 
                selectedSegments.has(d.Segment)
            );

            d3.select("#tree-chart").selectAll("*").remove();
            d3.select("#dumbbell-chart").selectAll("*").remove();

            if(filteredData.length === 0) {
                d3.select("#tree-chart").append("p").attr("class", "no-data").text("No data matches the selected filters.");
                d3.select("#dumbbell-chart").append("p").attr("class", "no-data").text("No data matches the selected filters.");
                return;
            }

            drawRadialTree(filteredData);
            drawDumbbellPlot(filteredData);
        }

        function drawRadialTree(data) {
            const width = 550;
            const height = 550;
            const radius = width / 2;

            const svg = d3.select("#tree-chart").append("svg")
                .attr("width", width)
                .attr("height", height)
                .append("g")
                .attr("transform", `translate(${width/2},${height/2})`);

            const rollupData = d3.rollup(data, 
                v => ({ Sales: d3.sum(v, d => d.Sales), Profit: d3.sum(v, d => d.Profit) }),
                d => d.Year, d => d.Quarter, d => d.Category
            );
            
            const hierarchy = d3.hierarchy(rollupData);

            const tree = d3.tree()
                .size([2 * Math.PI, radius - 100])
                .separation((a, b) => (a.parent == b.parent ? 1 : 2) / a.depth);

            const root = tree(hierarchy);

            // Links
            svg.append("g")
                .selectAll("path")
                .data(root.links())
                .join("path")
                .attr("class", "link")
                .attr("d", d3.linkRadial().angle(d => d.x).radius(d => d.y));

            // Nodes
            const node = svg.append("g")
                .selectAll("g")
                .data(root.descendants())
                .join("g")
                .attr("transform", d => `rotate(${d.x * 180 / Math.PI - 90}) translate(${d.y},0)`);

            node.append("circle")
                .attr("class", "dot")
                .attr("r", d => d.children ? 4 : 6)
                .attr("fill", d => {
                    if (!d.children && d.data[0]) return colorScale(d.data[0]);
                    return "#e0e0e0"; // Soft gray for inner nodes
                })
                .on("mouseover", (event, d) => {
                    let title = d.data[0] || "Superstore";
                    let content = `<b style="color:#666">${title}</b>`;
                    if (!d.children && d.data[1]) {
                        content += `<br>Sales: ${formatCurrency(d.data[1].Sales)}`;
                        content += `<br>Profit: <span style="color:${d.data[1].Profit < 0 ? '#ffb3ba' : '#baffc9'}">${formatCurrency(d.data[1].Profit)}</span>`;
                    } else if (d.depth === 1) {
                        content = `<b style="color:#555">Year: ${title}</b>`;
                    } else if (d.depth === 2) {
                        content = `<b style="color:#555">Quarter: ${title}</b>`;
                    }
                    showTooltip(event, content);
                })
                .on("mouseout", hideTooltip);

            node.append("text")
                .attr("dy", "0.31em")
                .attr("x", d => d.x < Math.PI === !d.children ? 10 : -10)
                .attr("text-anchor", d => d.x < Math.PI === !d.children ? "start" : "end")
                .attr("transform", d => d.x >= Math.PI ? "rotate(180)" : null)
                .text(d => d.data[0] || "All Data")
                .style("fill", d => !d.children ? "#555" : "#888")
                .style("font-weight", d => !d.children ? "bold" : "normal");
        }

        function drawDumbbellPlot(data) {
            const aggregated = Array.from(d3.rollup(data, 
                v => ({ Sales: d3.sum(v, d => d.Sales), Profit: d3.sum(v, d => d.Profit) }),
                d => d.Category
            ), ([Category, values]) => ({ Category, ...values }));

            const margin = {top: 50, right: 40, bottom: 60, left: 130};
            const width = 550 - margin.left - margin.right;
            const height = 400 - margin.top - margin.bottom;

            const svg = d3.select("#dumbbell-chart").append("svg")
                .attr("width", width + margin.left + margin.right)
                .attr("height", height + margin.top + margin.bottom)
                .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);

            const maxVal = d3.max(aggregated, d => Math.max(d.Sales, d.Profit)) || 0;
            const minVal = d3.min(aggregated, d => Math.min(d.Sales, d.Profit)) || 0;

            const x = d3.scaleLinear().domain([Math.min(0, minVal), maxVal]).nice().range([0, width]);
            const y = d3.scaleBand().domain(categories).range([0, height]).padding(0.4);

            // X Axis
            svg.append("g")
                .attr("transform", `translate(0,${height})`)
                .call(d3.axisBottom(x).ticks(5).tickFormat(d3.format("$.2s")))
                .selectAll("text").attr("class", "axis-label");

            // Y Axis
            svg.append("g")
                .call(d3.axisLeft(y).tickSize(0))
                .selectAll("text")
                .style("font-size", "13px")
                .style("font-weight", "bold")
                .style("fill", "#666");

            const validData = aggregated.filter(d => d.Sales !== undefined && d.Profit !== undefined);

            // Lines
            svg.selectAll(".line")
                .data(validData)
                .join("line")
                .attr("class", "line")
                .attr("x1", d => x(d.Profit))
                .attr("x2", d => x(d.Sales))
                .attr("y1", d => y(d.Category) + y.bandwidth() / 2)
                .attr("y2", d => y(d.Category) + y.bandwidth() / 2)
                .attr("stroke", "#e0e0e0")
                .attr("stroke-width", 3)
                .attr("opacity", 0)
                .transition().duration(800).attr("opacity", 1);

            // Sales Dots (Solid)
            svg.selectAll(".dot-sales")
                .data(validData)
                .join("circle")
                .attr("class", "dot dot-sales")
                .attr("cy", d => y(d.Category) + y.bandwidth() / 2)
                .attr("r", 7)
                .attr("fill", d => colorScale(d.Category))
                .attr("cx", d => x(0))
                .on("mouseover", (event, d) => showTooltip(event, `<b>${d.Category}</b><br>Sales: <span style="color:#8da47e">${formatCurrency(d.Sales)}</span>`))
                .on("mouseout", hideTooltip)
                .transition().duration(800).attr("cx", d => x(d.Sales));

            // Profit Dots (Hollow)
            svg.selectAll(".dot-profit")
                .data(validData)
                .join("circle")
                .attr("class", "dot dot-profit")
                .attr("cy", d => y(d.Category) + y.bandwidth() / 2)
                .attr("r", 7)
                .attr("fill", "#ffffff") 
                .attr("stroke", d => colorScale(d.Category))
                .attr("stroke-width", 2.5)
                .attr("cx", d => x(0))
                .on("mouseover", (event, d) => showTooltip(event, `<b>${d.Category}</b><br>Profit: <span style="color:${d.Profit < 0 ? '#ffb3ba' : '#8da47e'}">${formatCurrency(d.Profit)}</span>`))
                .on("mouseout", hideTooltip)
                .transition().duration(800).attr("cx", d => x(d.Profit));

            // Legend
            const legend = svg.append("g").attr("transform", `translate(${width / 2 - 80}, -35)`);
            
            legend.append("circle").attr("cx", 0).attr("cy", 0).attr("r", 6).attr("fill", "#b0b0b0");
            legend.append("text").attr("x", 12).attr("y", 4).text("Sales").style("font-size", "12px").attr("fill", "#777");

            legend.append("circle").attr("cx", 80).attr("cy", 0).attr("r", 6).attr("fill", "#ffffff").attr("stroke", "#b0b0b0").attr("stroke-width", 2);
            legend.append("text").attr("x", 92).attr("y", 4).text("Profit").style("font-size", "12px").attr("fill", "#777");
        }
    </script>
</body>
</html>
